spring:
  application:
    name: Coffee-System
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION}

app:
  superadmin:
    email: ${SUPERADMIN_EMAIL}
    password: ${SUPERADMIN_PASSWORD}
  # Where the front runs. Used for CORS and for sending the client back after paying.
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    # Comma-separated list, e.g. http://localhost:5173,https://coffee.example.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

mercadopago:
  access-token: ${MP_ACCESS_TOKEN:}
  # "Clave secreta" of the webhook in the MP developer panel. Empty = signature not checked.
  webhook-secret: ${MP_WEBHOOK_SECRET:}
  # Public URL of POST /payments/mercadopago/webhook (e.g. an ngrok URL). Empty = no webhook.
  notification-url: ${MP_NOTIFICATION_URL:}

resend:
  apikey: ${RESEND_APIKEY}