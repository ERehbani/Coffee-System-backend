spring:
  application:
    name: Coffee-System
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION}

app:
  superadmin:
    email: ${SUPERADMIN_EMAIL}
    password: ${SUPERADMIN_PASSWORD}