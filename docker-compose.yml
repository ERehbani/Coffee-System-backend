services:
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file:
      - .env
    # Inside the compose network the database is the "mysql" service, not localhost.
    # To use a MySQL running on your machine instead, set COMPOSE_DB_URL, COMPOSE_DB_USER and
    # COMPOSE_DB_PASSWORD in .env (host: host.docker.internal) and run: docker compose up -d --no-deps app
    environment:
      DB_URL: ${COMPOSE_DB_URL:-jdbc:mysql://mysql:3306/${MYSQL_DATABASE}}
      DB_USER: ${COMPOSE_DB_USER:-root}
      DB_PASSWORD: ${COMPOSE_DB_PASSWORD:-${MYSQL_ROOT_PASSWORD}}
      # The frontend container serves the app on :4000, besides ng serve on :4200.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200},http://localhost:4000
    container_name: spring-app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mysql_data: